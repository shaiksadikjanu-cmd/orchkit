name: ai-blog-publisher
steps:
  - id: fetch_news
    node: rss
    input:
      url: "https://hnrss.org/frontpage"
      limit: 5

  - id: write_post
    node: llm_groq
    input:
      prompt: "Write a blog post about these real HN stories today. Use the actual titles: ${fetch_news.feed_title}"
      max_tokens: 800

  - id: save
    node: fs_write
    input:
      path: "/tmp/orchkit-blog.md"
      content: "${write_post.text}"
